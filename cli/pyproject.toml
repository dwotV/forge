[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-cli"
version = "1.0.0"
description = "CLI de administración de Forge — entorno de hacking en Docker, controlado como una máquina virtual"
readme = "README_CLI.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1",
    "rich>=13.7",
    "PyYAML>=6.0",
    "docker>=7.0",
    "python-dotenv>=1.0",
    "tzlocal>=5.0",
]

[project.scripts]
forge = "forge.cli:cli"

[tool.setuptools.packages.find]
include = ["forge*"]
